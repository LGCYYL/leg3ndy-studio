name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner_name: windows
            release_script: npm run dist:win
          - os: macos-latest
            runner_name: macos
            release_script: npm run dist:mac

    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Signing Environment
        shell: pwsh
        run: |
          if ('${{ secrets.APPLE_ID }}') {
            "APPLE_ID=${{ secrets.APPLE_ID }}" >> $env:GITHUB_ENV
          }
          if ('${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}') {
            "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $env:GITHUB_ENV
          }
          if ('${{ secrets.APPLE_TEAM_ID }}') {
            "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $env:GITHUB_ENV
          }

          if ('${{ secrets.CSC_LINK }}') {
            "CSC_LINK<<EOF" >> $env:GITHUB_ENV
            '${{ secrets.CSC_LINK }}' >> $env:GITHUB_ENV
            "EOF" >> $env:GITHUB_ENV

            if ('${{ secrets.CSC_KEY_PASSWORD }}') {
              "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $env:GITHUB_ENV
            }
          }
          else {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $env:GITHUB_ENV
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $ffmpegExe = Get-ChildItem -Recurse -Filter "ffmpeg.exe" -Path ffmpeg_tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path resources_build | Out-Null
          Copy-Item $ffmpegExe.FullName resources_build\ffmpeg.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Build Python Engine
        run: pyinstaller leg3ndy-engine.spec

      - name: Build and Publish Release
        run: ${{ matrix.release_script }}

      - name: Upload Release Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leg3ndy-studio-${{ matrix.runner_name }}
          path: dist_electron/**/*
          if-no-files-found: warn
