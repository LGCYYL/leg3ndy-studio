name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runner_name: windows
            release_script: npm run dist:win -- --publish never
          - os: macos-latest
            runner_name: macos
            release_script: npm run dist:mac -- --publish never

    runs-on: ${{ matrix.os }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Signing Environment
        shell: pwsh
        run: |
          if ('${{ secrets.APPLE_ID }}') {
            "APPLE_ID=${{ secrets.APPLE_ID }}" >> $env:GITHUB_ENV
          }
          if ('${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}') {
            "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> $env:GITHUB_ENV
          }
          if ('${{ secrets.APPLE_TEAM_ID }}') {
            "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> $env:GITHUB_ENV
          }

          if ('${{ secrets.CSC_LINK }}') {
            "CSC_LINK<<EOF" >> $env:GITHUB_ENV
            '${{ secrets.CSC_LINK }}' >> $env:GITHUB_ENV
            "EOF" >> $env:GITHUB_ENV

            if ('${{ secrets.CSC_KEY_PASSWORD }}') {
              "CSC_KEY_PASSWORD=${{ secrets.CSC_KEY_PASSWORD }}" >> $env:GITHUB_ENV
            }
          }
          else {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $env:GITHUB_ENV
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $ffmpegExe = Get-ChildItem -Recurse -Filter "ffmpeg.exe" -Path ffmpeg_tmp | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path resources_build | Out-Null
          Copy-Item $ffmpegExe.FullName resources_build\ffmpeg.exe
          Remove-Item ffmpeg.zip, ffmpeg_tmp -Recurse -Force

      - name: Build Python Engine
        run: pyinstaller leg3ndy-engine.spec

      - name: Build Release Files
        run: ${{ matrix.release_script }}

      - name: Upload Release Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leg3ndy-studio-${{ matrix.runner_name }}
          if-no-files-found: warn
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
            dist_electron/*.blockmap
            dist_electron/*.yml

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Uploads
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          mkdir -p release-upload

          for file in release-artifacts/**/*.exe release-artifacts/**/*.dmg release-artifacts/**/*.zip release-artifacts/**/*.blockmap release-artifacts/**/*.yml; do
            [ -f "$file" ] || continue
            base="$(basename "$file")"

            if [ "$base" = "builder-debug.yml" ]; then
              continue
            fi

            target_name="$base"
            case "$base" in
              *.yml)
                ;;
              *)
                target_name="${base// /-}"
                ;;
            esac

            cp "$file" "release-upload/$target_name"
          done

      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          NOTES_FILE="docs/releases/${TAG}.md"

          files=(release-upload/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nenhum arquivo de release encontrado para publicar."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y
          fi

          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG" "${files[@]}" --title "LEG3NDY Studio ${VERSION}" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "${files[@]}" --title "LEG3NDY Studio ${VERSION}" --generate-notes
          fi
