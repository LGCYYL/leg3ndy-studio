name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger the workflow on version tags, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Engine
        run: |
          pyinstaller leg3ndy-engine.spec
          New-Item -ItemType Directory -Force -Path resources_build
          Copy-Item dist\leg3ndy-engine.exe resources_build\leg3ndy-engine.exe

      - name: Build and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
